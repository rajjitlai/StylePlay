<!DOCTYPE html>
<html lang="en">

<head>
    <title>StylePlay : Play in your own Style</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="img/icon.ico" type="image/x-icon">
</head>

<body>
    <header class="main-header">
        <div class="logo-container">
            <a href="/">
                <img src="/img/logo.png" alt="logo">
            </a>
        </div>
        <div class="tagline-container">
            <p>PLAY IN YOUR OWN STYLE</p>
        </div>
    </header>

    <div class="playground-container">
        <div class="editor-section">
            <div class="editor-header">
                <div class="window-controls"></div>
                <div class="toolbar">
                    <select id="snippet-select" class="snippet-select">
                        <option value="" disabled selected>Load Snippet...</option>
                        <option value="neon">Neon Glow</option>
                        <option value="glass">Glassmorphism</option>
                        <option value="grid">Grid Layout</option>
                        <option value="bounce">Bounce Animation</option>
                    </select>
                    <button id="copy-btn" class="tool-btn" title="Copy to Clipboard">
                        <i class="fa fa-copy"></i>
                    </button>
                    <button id="reset-btn" class="tool-btn" title="Reset Code">
                        <i class="fa fa-refresh"></i>
                    </button>
                </div>
            </div>
            <style contenteditable class="live-css-editor" id="live-css">
                body {
                    font-family: 'Inter', sans-serif;
                    background: #0f172a;
                    color: white;
                }

                .preview-box {
                    border-radius: 12px;
                    transition: all 0.3s ease;
                    box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
                }

                .box-1 {
                    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
                }

                .box-2 {
                    background: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);
                }

                .box-3 {
                    background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
                }

                .box-4 {
                    background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
                }
            </style>
        </div>

        <div class="preview-section">
            <div class="preview-header">
                <button class="device-btn active" data-device="desktop" title="Desktop View">
                    <i class="fa fa-desktop"></i>
                </button>
                <button class="device-btn" data-device="tablet" title="Tablet View">
                    <i class="fa fa-tablet"></i>
                </button>
                <button class="device-btn" data-device="mobile" title="Mobile View">
                    <i class="fa fa-mobile"></i>
                </button>
            </div>
            <div class="preview-content" id="preview-container">
                <div class="preview-column">
                    <div>
                        <div class="preview-box box-1" contenteditable></div>
                    </div>
                    <div>
                        <div class="preview-box box-2" contenteditable></div>
                    </div>
                </div>
                <div class="preview-column">
                    <div>
                        <div class="preview-box box-3" contenteditable></div>
                    </div>
                    <div>
                        <div class="preview-box box-4" contenteditable></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="info-box">
        <div class="information">
            <h2>CSS Properties You Can Use</h2>
            <ul>
                <li>
                    <span>background:</span> <i>color</i>;
                </li>
                <li><span>background-image:</span> url(<i>image-url</i>);
                </li>
                <li>
                    <span>background-position:</span> <i>center</i>;
                </li>
                <li>
                    <span>background-size:</span> <i>cover</i>;
                </li>
                <li>
                    <span>width:</span> <i>px/auto</i>;
                </li>
                <li>
                    <span>height:</span> <i>px/auto</i>;
                </li>
                <li>
                    <span>border-radius:</span> <i>px/%</i>;
                </li>
            </ul>
        </div>
    </div>

    <footer>
        <p>Copyright &copy; 2023 StylePlay</p>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
